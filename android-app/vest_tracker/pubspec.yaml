name: vest_tracker
description: "A new Flutter project."


publish_to: 'none'


version: 1.8.10

environment:
  sdk: ^3.11.5


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  collection: ^1.19.1
  shared_preferences: ^2.5.3
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_database: ^12.0.0
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  flutter_local_notifications: ^20.0.0
  workmanager: ^0.8.0
  uuid: ^4.5.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.4


flutter:


  uses-material-design: true


  assets:
    - assets/icons/


flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/vest_tracker_icon.png
